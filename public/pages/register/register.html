<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | 종주 메이트</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚴</text></svg>">
  <link rel="stylesheet" href="/components/layout/layout.css">
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="main-content">
    <div class="container">
      <!-- 왼쪽: 고정 영역 -->
      <div class="intro-section">
        <div class="intro-inner">
          <div class="hero-animation">
            <div class="road"></div>
            <span class="mountain mountain-1">⛰️</span>
            <span class="mountain mountain-2">🏔️</span>
            <span class="tree">🌲</span>
            <span class="car">🚗</span>
            <span class="cyclist">🚴</span>
            <span class="hiker">🚶</span>
          </div>
          <h1 class="title">종주 메이트</h1>
          <p class="subtitle">함께 달리는 국토종주 커뮤니티</p>
          <ul class="benefits">
            <li>종주 경험을 공유하고 소통해요</li>
            <li>유용한 정보와 팁을 나눠요</li>
            <li>같이 달릴 메이트를 찾아요</li>
          </ul>
          <p class="login-text">
            이미 계정이 있으신가요?
            <a href="/pages/login/login.html" class="login-link">로그인</a>
          </p>
        </div>
      </div>

      <!-- 오른쪽: 동적으로 바뀌는 영역 -->
      <div id="content-area" class="register-section">
        <!-- 기본화면: 간편가입 -->
        <h2>회원가입</h2>
        <p class="register-desc">네이버, 카카오로 간편하게 시작하세요!</p>

        <button class="btn naver">N 네이버로 시작하기</button>
        <button class="btn kakao">카카오로 시작하기</button>

        <div class="divider">또는</div>

        <button class="btn id-signup">아이디로 회원가입</button>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="/components/layout/layout.js"></script>
  <script type="module" src="register.js"></script>
</body>
</html>
