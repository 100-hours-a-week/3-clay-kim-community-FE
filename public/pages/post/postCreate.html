<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종주 기록 작성 | 종주 메이트</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚴</text></svg>">
    <link rel="stylesheet" href="/components/layout/layout.css">
    <link rel="stylesheet" href="/components/modal/modal.css">
    <link rel="stylesheet" href="/pages/post/postCreate.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <div id="sidebar-placeholder"></div>

    <main class="main-content">
        <div class="post-create-container">
            <div class="post-create-header">
                <h1>종주 기록 작성</h1>
                <p class="post-create-description">종주 경험을 기록해보세요!</p>
            </div>

            <form class="post-create-form" id="postCreateForm">
                <!-- 타입 선택 드롭다운 -->
                <div class="form-type-section">
                    <span class="type-label">게시글 타입</span>
                    <div class="type-selector-wrapper">
                        <div class="type-selector-button" id="typeSelectorButton">
                            <span class="type-selector-text" id="typeSelectorText">국토종주 준비 & 진행</span>
                            <span class="type-selector-arrow">▼</span>
                        </div>
                        <div class="type-dropdown" id="typeDropdown">
                            <div class="type-dropdown-item" data-value="in_progress">
                                국토종주 준비 & 진행
                            </div>
                            <div class="type-dropdown-item" data-value="completed">
                                국토종주 완료
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 숨겨진 타입 입력 -->
                <input type="hidden" id="postType" value="in_progress" required />

                <!-- 제목 입력 -->
                <div class="form-group">
                    <label for="postTitle" class="form-label">
                        제목 <span class="required">*</span>
                    </label>
                    <input
                        type="text"
                        id="postTitle"
                        class="form-input"
                        placeholder="제목을 입력하세요 (최대 40자)"
                        maxlength="40"
                        required
                    />
                    <div class="form-help">
                        <span id="titleCount">0</span> / 40
                    </div>
                </div>

                <!-- 내용 입력 -->
                <div class="form-group">
                    <label for="postContent" class="form-label">
                        내용 <span class="required">*</span>
                    </label>
                    <textarea 
                        id="postContent" 
                        class="form-textarea" 
                        placeholder="내용을 입력하세요 (최대 1000자)"
                        maxlength="1000"
                        rows="15"
                        required
                    ></textarea>
                    <div class="form-help">
                        <span id="contentCount">0</span> / 1000
                    </div>
                </div>

                <!-- 이미지 업로드 -->
                <div class="form-group">
                    <label for="postImages" class="form-label">
                        이미지 첨부 <span class="optional">(선택)</span>
                    </label>
                    <div class="image-upload-wrapper">
                        <input 
                            type="file" 
                            id="postImages" 
                            accept="image/*" 
                            multiple
                            hidden
                        />
                        <label class="image-upload-dropzone" for="postImages">
                            <div class="dropzone-icon">📷</div>
                            <div class="dropzone-text">
                                <strong>이미지 업로드</strong>
                                <span>최대 5장, 한 장당 5MB 이하</span>
                            </div>
                            <div class="dropzone-button">파일 선택</div>
                        </label>
                        <div id="imagePreviewList" class="image-preview-list"></div>
                    </div>
                </div>

                <!-- 버튼 그룹 -->
                <div class="form-actions">
                    <button type="button" class="btn btn-cancel" id="btnCancel">
                        취소
                    </button>
                    <button type="submit" class="btn btn-submit" id="btnSubmit">
                        <span class="btn-icon">✏️</span>
                        작성 완료
                    </button>
                </div>
            </form>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/components/modal/modal.js"></script>
    <script type="module" src="/components/layout/layout.js"></script>
    <script type="module" src="/pages/post/postCreate.js"></script>
</body>
</html>
