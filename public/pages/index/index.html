<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종주메이트 - 함께 걷는 우리의 이야기</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚴</text></svg>">
    <link rel="stylesheet" href="/components/layout/layout.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            color: #333;
            line-height: 1.6;
        }

        /* Hero Section */
        .hero {
            background:
                linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
                url('/images/hero-bike.jpg') center/cover no-repeat;
            padding: 8rem 2rem;
            text-align: center;
            position: relative;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-size: 3rem;
            color: #ffffff;
            margin-bottom: 1rem;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .hero p {
            font-size: 1.3rem;
            color: #ffffff;
            margin-bottom: 2rem;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: white;
            color: #2d5a3d;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            border: 3px solid #2d5a3d;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: #2d5a3d;
            color: white;
        }

        .btn-secondary {
            background: white;
            color: #2d5a3d;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            border: 3px solid #2d5a3d;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: #2d5a3d;
            color: white;
        }

        /* Stats Section */
        .stats {
            background: white;
            padding: 3rem 2rem;
        }

        .stats-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            text-align: center;
        }

        .stat-item {
            padding: 1.5rem;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2d5a3d;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 1rem;
            color: #666;
        }

        /* Content Section */
        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            color: #2d5a3d;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* Recent Posts */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .post-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }

        .post-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #81c784 0%, #66bb6a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .post-image.has-image {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        .post-image.has-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(0,0,0,0.25));
        }

        .post-content {
            padding: 1.5rem;
        }

        .post-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .post-excerpt {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .post-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #999;
        }

        .post-author {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .post-author-profile-image {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e0e0e0;
        }

        /* Features */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .feature-card {
            text-align: center;
            padding: 2rem;
            background: #f8f9fa;
            border-radius: 12px;
            transition: background 0.2s;
        }

        .feature-card:hover {
            background: #e8f5e9;
        }

        .feature-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .feature-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2d5a3d;
            margin-bottom: 0.5rem;
        }

        .feature-desc {
            color: #666;
        }


        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1.1rem;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>
    <div id="sidebar-placeholder"></div>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>함께 걷는 우리의 이야기</h1>
            <p>국토종주의 모든 순간을 기록하고 공유하세요</p>
            <div class="hero-buttons">
                <a href="/pages/post/post.html" class="btn-primary">시작하기</a>
                <a href="/pages/post/post.html?period=weekly" class="btn-secondary">주간 인기 여정</a>
            </div>
        </div>
    </section>

    <!-- Stats -->
    <section class="stats">
        <div class="stats-container">
            <div class="stat-item">
                <a href="/pages/post/post.html?view=top10" style="text-decoration: none; color: inherit; display: block;">
                    <div class="stat-number" id="completedCount">-</div>
                    <div class="stat-label">종주 완료자</div>
                </a>
            </div>
            <div class="stat-item">
                <a href="/pages/post/post.html" style="text-decoration: none; color: inherit; display: block;">
                    <div class="stat-number" id="inProgressCount">-</div>
                    <div class="stat-label">진행중인 도전</div>
                </a>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="imageCount">-</div>
                <div class="stat-label">공유된 사진</div>
            </div>
            <div class="stat-item">
                <a href="https://www.bike.go.kr/content.do?key=2006176999425" target="_blank" rel="noopener noreferrer" style="text-decoration: none; color: inherit;">
                    <div class="stat-number">86</div>
                    <div class="stat-label">인증센터</div>
                </a>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <div class="content">
        <!-- Recent Posts -->
        <h2 class="section-title">최근 종주 이야기</h2>
        <div class="posts-grid" id="recentPostsGrid">
            <!-- 로딩 중 표시 -->
            <div class="loading-message">최근 게시글을 불러오는 중...</div>
        </div>

        <!-- Features -->
        <h2 class="section-title">종주메이트에서 할 수 있는 것</h2>
        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">📍</div>
                <h3 class="feature-title">실시간 인증</h3>
                <p class="feature-desc">인증센터에서 QR코드로 간편하게 인증하세요</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">📊</div>
                <h3 class="feature-title">기록 관리</h3>
                <p class="feature-desc">나의 종주 기록을 한눈에 확인하고 관리하세요</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">👥</div>
                <h3 class="feature-title">동행자 찾기</h3>
                <p class="feature-desc">함께 걸을 동행자를 찾아보세요</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">📸</div>
                <h3 class="feature-title">추억 공유</h3>
                <p class="feature-desc">종주 중 만난 아름다운 풍경을 공유하세요</p>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script type="module" src="/components/layout/layout.js"></script>

    <script type="module">
        import { get, post } from '/utils/fetchApi.js';
        import { API_ENDPOINTS, BASE_URL } from '/utils/apiList.js';

        // 숫자 카운팅 애니메이션 (슬롯머신 스타일)
        function animateCount(element, target, duration = 1500) {
            const startTime = performance.now();
            const maxRandom = Math.max(target * 3, 100); // 최종값의 3배 또는 최소 100

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                if (progress < 0.8) {
                    // 80%까지는 랜덤으로 빠르게 변함
                    const randomNum = Math.floor(Math.random() * maxRandom);
                    element.textContent = randomNum.toLocaleString();
                    requestAnimationFrame(update);
                } else if (progress < 1) {
                    // 마지막 20%는 목표값에 수렴
                    const remaining = (1 - progress) / 0.2; // 0.2 구간을 0~1로 정규화
                    const easeProgress = 1 - Math.pow(remaining, 3);
                    const current = Math.floor(target * easeProgress);
                    element.textContent = current.toLocaleString();
                    requestAnimationFrame(update);
                } else {
                    // 최종값
                    element.textContent = target.toLocaleString();
                }
            }

            requestAnimationFrame(update);
        }

        // 게시글 타입별 카운트 조회
        async function fetchPostTypeCounts() {
            try {
                // 완료된 게시글 수 조회
                const { error: completedError, result: completedResult } = await get(
                    API_ENDPOINTS.POSTS.TYPE_COUNT('completed')
                );

                if (!completedError && completedResult?.data?.postTypeCount !== undefined) {
                    const completedElement = document.getElementById('completedCount');
                    animateCount(completedElement, completedResult.data.postTypeCount);
                }

                // 진행중인 게시글 수 조회
                const { error: inProgressError, result: inProgressResult } = await get(
                    API_ENDPOINTS.POSTS.TYPE_COUNT('in_progress')
                );

                if (!inProgressError && inProgressResult?.data?.postTypeCount !== undefined) {
                    const inProgressElement = document.getElementById('inProgressCount');
                    animateCount(inProgressElement, inProgressResult.data.postTypeCount);
                }
            } catch (error) {
                console.error('게시글 타입별 카운트 조회 실패:', error);
            }
        }

        // 이미지 카운트 조회
        async function fetchImageCount() {
            try {
                const { error, result } = await get(API_ENDPOINTS.IMAGES.STATUS);

                if (!error && result?.data?.imageCount !== undefined) {
                    const imageElement = document.getElementById('imageCount');
                    animateCount(imageElement, result.data.imageCount);
                }
            } catch (error) {
                console.error('이미지 카운트 조회 실패:', error);
            }
        }

        // 최근 게시글 3개 조회
        async function fetchRecentPosts() {
            try {
                const { error, result } = await get(API_ENDPOINTS.POSTS.INDEX);

                const postsGrid = document.getElementById('recentPostsGrid');

                if (error || !Array.isArray(result?.data) || result.data.length === 0) {
                    postsGrid.innerHTML = '<div class="loading-message">최근 게시글이 없습니다.</div>';
                    return;
                }

                // 게시글 카드 렌더링
                postsGrid.innerHTML = result.data.map(post => {
                    // 타입 텍스트 선택 (이모지는 모두 자전거)
                    const typeText = post.postType === 'COMPLETED' ? '[국토종주 완료]' : '[국토종주 준비 & 진행]';

                    // 프로필 이미지 URL 처리
                    const imageUrl = post.imageUrl || post.profileImage || post.authorProfileImage || post.userProfileImage || '';
                    // 이미 완전한 URL인 경우 그대로 사용, 아니면 BASE_URL 붙이기
                    const profileImageUrl = imageUrl
                        ? (imageUrl.startsWith('http://') || imageUrl.startsWith('https://'))
                            ? imageUrl
                            : `${BASE_URL}/${imageUrl}`
                        : '';
                    const profileImageHtml = profileImageUrl
                        ? `<img src="${escapeHtml(profileImageUrl)}" alt="프로필" class="post-author-profile-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
                           <span style="display:none;">👤</span>`
                        : `<span>👤</span>`;

                    // 게시글 대표 이미지
                    const rawPostImage = post.postImageUrl || '';
                    const resolvedPostImage = rawPostImage
                        ? (rawPostImage.startsWith('http://') || rawPostImage.startsWith('https://'))
                            ? rawPostImage
                            : `${BASE_URL}/${rawPostImage}`
                        : '';
                    const postImageHtml = resolvedPostImage
                        ? `<div class="post-image has-image" style="background-image: url('${escapeHtml(resolvedPostImage)}');"></div>`
                        : `<div class="post-image">🚴</div>`;

                    return `
                        <div class="post-card" onclick="location.href='/pages/postDetail/postDetail.html?id=${post.id}'">
                            ${postImageHtml}
                            <div class="post-content">
                                <div style="font-size: 12px; font-weight: 600; color: #007bff; margin-bottom: 8px;">${typeText}</div>
                                <h3 class="post-title">${escapeHtml(post.title || '제목 없음')}</h3>
                                <div class="post-meta">
                                    <span class="post-author">
                                        ${profileImageHtml}
                                        <span>${escapeHtml(post.nickname || '익명')}</span>
                                    </span>
                                    <span>조회수 ${post.viewCount || 0}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('최근 게시글 조회 실패:', error);
                const postsGrid = document.getElementById('recentPostsGrid');
                postsGrid.innerHTML = '<div class="loading-message">게시글을 불러오는데 실패했습니다.</div>';
            }
        }

        // HTML 이스케이프 함수
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 페이지 로드 시 초기화
        document.addEventListener("DOMContentLoaded", () => {
            fetchPostTypeCounts();
            fetchImageCount();
            fetchRecentPosts();
        });
    </script>
</body>
</html>
