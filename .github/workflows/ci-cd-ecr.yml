name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # 1. AWS 인증
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 2. Amazon ECR 로그인
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Docker Buildx 설정 (ARM64 크로스 빌드 + 캐시)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 4. Docker 이미지 빌드 & 푸시
      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      FRONTEND_APP_DIR: /opt/community/V1/docker/app
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Send SSM Command
        run: |
          set -eu
          APP_INSTANCE_ID=$(aws ec2 describe-instances \
            --region ${{ secrets.AWS_REGION }} \
            --filters \
              "Name=tag:Environment,Values=prod" \
              "Name=tag:DeployTarget,Values=community-app" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)

          if [ -z "$APP_INSTANCE_ID" ] || [ "$APP_INSTANCE_ID" = "None" ]; then
            echo "ERROR: deploy target instance not found"
            exit 1
          fi

          cat > /tmp/frontend-deploy-params.json <<EOF
          {
            "commands": [
              "set -e",
              "cd ${FRONTEND_APP_DIR}",
              "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }} AWS_REGION=${{ secrets.AWS_REGION }} FRONT_REPOSITORY=${{ secrets.ECR_REPOSITORY }} ./deploy.sh frontend latest",
              "docker inspect -f '{{.State.Running}}' community-frontend | grep true",
              "docker inspect -f '{{.State.Running}}' community-nginx | grep true",
              "ok=0; for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:3000/health > /dev/null; then ok=1; break; fi; sleep 2; done; if [ \"$ok\" -ne 1 ]; then docker logs --tail 100 community-frontend; exit 1; fi"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --region ${{ secrets.AWS_REGION }} \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$APP_INSTANCE_ID" \
            --comment "Deploy Frontend via deploy.sh" \
            --parameters file:///tmp/frontend-deploy-params.json \
            --query "Command.CommandId" \
            --output text)

          set +e
          aws ssm wait command-executed \
            --region ${{ secrets.AWS_REGION }} \
            --command-id "$COMMAND_ID" \
            --instance-id "$APP_INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          echo "SSM_COMMAND_ID=${COMMAND_ID}"
          STATUS=$(aws ssm get-command-invocation \
            --region ${{ secrets.AWS_REGION }} \
            --command-id "$COMMAND_ID" \
            --instance-id "$APP_INSTANCE_ID" \
            --query "StatusDetails" \
            --output text)

          STDOUT=$(aws ssm get-command-invocation \
            --region ${{ secrets.AWS_REGION }} \
            --command-id "$COMMAND_ID" \
            --instance-id "$APP_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text)

          STDERR=$(aws ssm get-command-invocation \
            --region ${{ secrets.AWS_REGION }} \
            --command-id "$COMMAND_ID" \
            --instance-id "$APP_INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text)

          printf '%s\n' "$STDOUT"

          if [ "$STDERR" != "None" ]; then
            printf '%s\n' "$STDERR" >&2
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed: $STATUS" >&2
            exit 1
          fi

          if [ "$WAIT_EXIT" -ne 0 ]; then
            echo "SSM waiter exited with $WAIT_EXIT despite final status $STATUS" >&2
            exit "$WAIT_EXIT"
          fi
