name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # 1. AWS 인증
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 2. Amazon ECR 로그인
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Docker Buildx 설정 (ARM64 크로스 빌드 + 캐시)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 4. Docker 이미지 빌드 & 푸시
      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      FRONTEND_APP_DIR: /opt/community/V1/docker/app
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Send SSM Command
        run: |
          set -eu
          COMMAND_ID=$(aws ssm send-command \
            --region ${{ secrets.AWS_REGION }} \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Environment,Values=prod" "Key=tag:DeployTarget,Values=community-app" \
            --comment "Deploy Frontend" \
            --parameters "commands=[\"cd ${FRONTEND_APP_DIR}\",\"export FRONTEND_IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest\",\"docker compose pull frontend\",\"docker compose up -d --force-recreate frontend\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM_COMMAND_ID=${COMMAND_ID}"
          for i in {1..30}; do
            STATUS=$(aws ssm list-command-invocations \
              --region ${{ secrets.AWS_REGION }} \
              --command-id "$COMMAND_ID" \
              --query "CommandInvocations[0].Status" \
              --output text)

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelling" ] || [ "$STATUS" = "Cancelled" ]; then
              aws ssm list-command-invocations \
                --region ${{ secrets.AWS_REGION }} \
                --command-id "$COMMAND_ID" \
                --details \
                --query "CommandInvocations[].{InstanceId:InstanceId,Status:Status,Output:CommandPlugins[0].Output}" \
                --output table
              exit 1
            fi

            sleep 10
          done

          aws ssm list-command-invocations \
            --region ${{ secrets.AWS_REGION }} \
            --command-id "$COMMAND_ID" \
            --details \
            --query "CommandInvocations[].{InstanceId:InstanceId,Status:Status,Output:CommandPlugins[0].Output}" \
            --output table
